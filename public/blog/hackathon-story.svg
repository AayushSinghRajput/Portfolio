<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#181324"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="700" cy="260" r="300" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Badge -->
  <rect x="100" y="80" width="160" height="36" rx="18" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="180" y="103" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#fde68a" text-anchor="middle">HACKATHON STORY</text>

  <!-- Title -->
  <text x="100" y="180" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    Runner-Up at Janakpur
  </text>
  <text x="100" y="240" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="-0.02em">
    National Hackathon 2024
  </text>

  <!-- Subtitle -->
  <text x="100" y="300" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">
    36 hours of relentless coding, teamwork, and building impactful AI solutions
  </text>

  <!-- Highlights -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="280" height="100" rx="12" fill="#1c1917" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="140" y="45" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#fde68a" text-anchor="middle">2nd Place</text>
    <text x="140" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#a8a29e" text-anchor="middle">National Recognition</text>

    <rect x="310" y="0" width="280" height="100" rx="12" fill="#1c1917" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="450" y="45" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#fbcfe8" text-anchor="middle">36 Hours</text>
    <text x="450" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#a8a29e" text-anchor="middle">Continuous Innovation</text>

    <rect x="620" y="0" width="280" height="100" rx="12" fill="#1c1917" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="760" y="45" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ddd6fe" text-anchor="middle">Civic Tech</text>
    <text x="760" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#a8a29e" text-anchor="middle">AI for Social Impact</text>
  </g>

  <!-- Author Info -->
  <g transform="translate(100, 530)">
    <text x="0" y="25" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Aayush Kumar Singh</text>
    <text x="0" y="45" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Full Stack Developer &amp; ML Engineer • aayushkumarsingh.com.np</text>
  </g>
</svg>
