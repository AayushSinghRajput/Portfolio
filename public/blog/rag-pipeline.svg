<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#121124"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="280" r="300" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Grid decoration -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Badge -->
  <rect x="100" y="80" width="180" height="36" rx="18" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4"/>
  <text x="190" y="103" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="middle">TECHNICAL DEEP DIVE</text>

  <!-- Title -->
  <text x="100" y="180" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    Building RAG Pipelines
  </text>
  <text x="100" y="240" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="-0.02em">
    with ChromaDB &amp; FastAPI
  </text>

  <!-- Subtitle -->
  <text x="100" y="300" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">
    Production-ready Retrieval-Augmented Generation from SmartPrep AI
  </text>

  <!-- Architecture Flow Diagram -->
  <g transform="translate(100, 360)">
    <!-- Node 1: Docs -->
    <rect x="0" y="0" width="180" height="90" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="90" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#c7d2fe" text-anchor="middle">Documents</text>
    <text x="90" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#818cf8" text-anchor="middle">PDFs &amp; Text Chunks</text>

    <!-- Arrow 1 -->
    <path d="M 190 45 L 240 45" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="215" cy="45" r="3" fill="#6366f1"/>

    <!-- Node 2: ChromaDB -->
    <rect x="250" y="0" width="200" height="90" rx="12" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="350" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ddd6fe" text-anchor="middle">ChromaDB</text>
    <text x="350" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle">Vector Embeddings</text>

    <!-- Arrow 2 -->
    <path d="M 460 45 L 510 45" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="485" cy="45" r="3" fill="#8b5cf6"/>

    <!-- Node 3: FastAPI -->
    <rect x="520" y="0" width="200" height="90" rx="12" fill="#0f2b38" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="620" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#cffafe" text-anchor="middle">FastAPI Engine</text>
    <text x="620" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#22d3ee" text-anchor="middle">Retrieval &amp; Context</text>

    <!-- Arrow 3 -->
    <path d="M 730 45 L 780 45" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="755" cy="45" r="3" fill="#06b6d4"/>

    <!-- Node 4: LLM -->
    <rect x="790" y="0" width="210" height="90" rx="12" fill="#142e2b" stroke="#10b981" stroke-width="1.5"/>
    <text x="895" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#d1fae5" text-anchor="middle">LLM Generation</text>
    <text x="895" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">Grounded Answers</text>
  </g>

  <!-- Author Info -->
  <g transform="translate(100, 530)">
    <text x="0" y="25" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Aayush Kumar Singh</text>
    <text x="0" y="45" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Full Stack Developer &amp; ML Engineer • aayushkumarsingh.com.np</text>
  </g>
</svg>
