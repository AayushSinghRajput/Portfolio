<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="500" cy="260" r="300" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Badge -->
  <rect x="100" y="80" width="160" height="36" rx="18" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="180" y="103" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#93c5fd" text-anchor="middle">CAREER JOURNEY</text>

  <!-- Title -->
  <text x="100" y="180" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    From React Developer to
  </text>
  <text x="100" y="240" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="-0.02em">
    Machine Learning Engineer
  </text>

  <!-- Subtitle -->
  <text x="100" y="300" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">
    My transition path, mathematics behind ML, practical milestones &amp; advice
  </text>

  <!-- Milestones -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="280" height="100" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="140" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#bfdbfe" text-anchor="middle">Frontend Mastery</text>
    <text x="140" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">React • TS • UX</text>

    <rect x="310" y="0" width="280" height="100" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="450" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ddd6fe" text-anchor="middle">Data &amp; Math Core</text>
    <text x="450" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Linear Algebra • Stats</text>

    <rect x="620" y="0" width="280" height="100" rx="12" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="760" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#a7f3d0" text-anchor="middle">Applied ML &amp; LLMs</text>
    <text x="760" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">FastAPI • PyTorch • RAG</text>
  </g>

  <!-- Author Info -->
  <g transform="translate(100, 530)">
    <text x="0" y="25" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Aayush Kumar Singh</text>
    <text x="0" y="45" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Full Stack Developer &amp; ML Engineer • aayushkumarsingh.com.np</text>
  </g>
</svg>
