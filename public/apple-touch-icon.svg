<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Architectural Deep Ink Canvas Tile -->
  <rect width="180" height="180" rx="42" fill="#20201D"/>
  
  <!-- Subtle Architectural Technical Framing -->
  <rect x="10" y="10" width="160" height="160" rx="32" stroke="#5E5B54" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.55"/>
  
  <!-- Signature Vermilion Coordinate Dot -->
  <circle cx="140" cy="40" r="9" fill="#E65336"/>

  <!-- Architectural AKS Monogram in Warm Ivory -->
  <text 
    x="90" 
    y="114" 
    font-family="Georgia, 'Times New Roman', 'Instrument Serif', serif" 
    font-size="65" 
    font-weight="700" 
    text-anchor="middle" 
    fill="#F5F1E8" 
    letter-spacing="2"
  >AKS</text>
  
  <!-- Technical Dimension Rule in Olive -->
  <rect x="62" y="128" width="56" height="2.5" rx="1.25" fill="#8A9367" opacity="0.8"/>
</svg>